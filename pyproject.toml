[project]
name = "second-brain"
version = "0.1.0"
description = "Private, local, multi-source RAG second brain"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-ollama",
    "langchain-postgres",
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "httpx>=0.28.1",
    "fastembed>=0.9.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
